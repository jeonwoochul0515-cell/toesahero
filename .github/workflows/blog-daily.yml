name: Daily Blog Auto-Publish

on:
  schedule:
    # 매주 월/수/금 00:10 UTC = 09:10 KST 에 1편씩, 주 3회 자동 발행
    - cron: "10 0 * * 1,3,5"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod를 화면별 git 수정일로 만들려면 전체 이력이 필요하다

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate & publish one post
        id: publish
        env:
          ADMIN_EMAIL: ${{ secrets.BLOG_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BLOG_ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: node scripts/auto-publish-daily.mjs

      # 새 글은 Firestore에만 쓰여지고 사이트는 SSG 프리렌더라, 재빌드·재배포 전까지는
      # /blog/:slug 가 404를 반환한다(functions/_middleware.ts는 /my,/checkout,/admin만 SPA 폴백).
      # 발행 직후 여기서 바로 재빌드·재배포해 새 글을 라이브로 반영한다.
      - name: Rebuild site (프리렌더에 새 글 반영)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY }}
        run: npm run build

      - name: Check Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=toesahero --branch=main --commit-message="자동발행 글 반영 재배포 ${{ github.sha }}" --commit-hash=${{ github.sha }}

      # 새 글 주소 IndexNow 통지 — 배포가 끝나 주소가 실제로 열린 뒤에 보낸다(예전엔 배포 전에 보내 404를 알렸다).
      # 네이버는 직접, 나머지(빙 등)는 IndexNow 공용 주소로. 실패해도 발행·배포는 그대로다(2026-10-15).
      - name: IndexNow 통지 (배포 뒤)
        if: steps.cf.outputs.ready == 'true' && steps.publish.outputs.url != ''
        continue-on-error: true
        env:
          POST_URL: ${{ steps.publish.outputs.url }}
          INDEXNOW_KEY: 938f576e2a5781026560da253ad84446
        run: |
          sleep 15
          echo "열림 확인: $(curl -s -o /dev/null -w '%{http_code}' "$POST_URL")"
          BODY="{\"host\":\"toesahero.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://toesahero.com/$INDEXNOW_KEY.txt\",\"urlList\":[\"$POST_URL\"]}"
          for EP in https://searchadvisor.naver.com/indexnow https://api.indexnow.org/indexnow; do
            echo "IndexNow $EP: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" "$EP")"
          done
